name: Kernel development
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build runner
        run: |
          set -e
          df -h .
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git rsync curl wget zip unzip bsdiff make build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev cpio lz4 zstd python3 device-tree-compiler xz-utils
          df -h .

      - name: Download pinned kernel and KernelSU Next legacy driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git clone --filter=blob:none --depth 1 --single-branch --branch 'duhan-(4.9.337)' \
            https://github.com/Eend15/exynos9810-kernel.git kernel
          git -C kernel fetch --depth 1 origin 8f29b4e0e977d521bb5866ad167b391bea2988c9
          git -C kernel checkout --detach 8f29b4e0e977d521bb5866ad167b391bea2988c9
          git clone --filter=blob:none --depth 1 --single-branch --branch legacy \
            https://github.com/KernelSU-Next/KernelSU-Next.git upstream
          git -C upstream fetch --depth 1 origin 0b17f24246db5c80c056b92c15bcad2b77f1276e
          git -C upstream checkout --detach 0b17f24246db5c80c056b92c15bcad2b77f1276e
          git -C upstream fetch --unshallow --tags || true
          printf 'Device source: %s\nKSU source: %s\n' \
            "$(git -C kernel rev-parse HEAD)" \
            "$(git -C upstream rev-parse HEAD)" | tee audit/commits.txt
          test -f kernel/fs/susfs.c
          test -f kernel/KernelSU-Next/kernel/Kbuild
          test -f kernel/arch/arm64/configs/star2lte_defconfig

      - name: Audit changes and create isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          diff -qr kernel/KernelSU-Next/kernel upstream/kernel > audit/change-summary.txt || test "$?" -eq 1
          diff -ruN kernel/KernelSU-Next/kernel upstream/kernel > audit/driver-update.diff || test "$?" -eq 1
          diff -ruN kernel/KernelSU-Next/uapi upstream/uapi > audit/uapi-update.diff || test "$?" -eq 1
          git -C kernel worktree add --detach ../candidate HEAD
          rsync -a --delete --exclude=.git upstream/kernel/ candidate/KernelSU-Next/kernel/
          rsync -a --delete --exclude=.git upstream/uapi/ candidate/KernelSU-Next/uapi/
          # Initial compatibility probe: retain ROM-specific early init and manager handling.
          for p in core/init.c runtime/ksud_integration.c manager/pkg_observer.c; do
            cp "kernel/KernelSU-Next/kernel/$p" "candidate/KernelSU-Next/kernel/$p"
          done
          python3 scripts/fix_ksu_execveat.py candidate/KernelSU-Next/kernel/core/init.c candidate/KernelSU-Next/kernel/runtime/ksud.h candidate/KernelSU-Next/kernel/runtime/ksud_integration.c
          git -C candidate add -N -- KernelSU-Next/kernel KernelSU-Next/uapi
          git -C candidate diff -- KernelSU-Next/kernel KernelSU-Next/uapi > audit/candidate.patch
          git -C candidate diff --stat > audit/candidate-stat.txt
          grep -q '^CONFIG_KSU_SUSFS=y$' candidate/arch/arm64/configs/apollo_defconfig
          grep -q '^CONFIG_EROFS_FS=y$' candidate/arch/arm64/configs/exynos9810_defconfig

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-source-audit
          path: audit/
          retention-days: 14
          if-no-files-found: warn

      - name: Download Google Android Clang 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/google-clang20"
          curl -fL --retry 3 --retry-delay 5 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz' \
            | tar -xz -C "$RUNNER_TEMP/google-clang20"
          test -x "$RUNNER_TEMP/google-clang20/bin/clang"
          echo "DS_ACK_TOOLCHAIN=$RUNNER_TEMP/google-clang20" >> "$GITHUB_ENV"

      - name: Compile original ROM source baseline - SM-G965F
        id: baseline
        shell: bash
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          export TERM=xterm DS_ACK_JOBS=2
          cd kernel
          printf '2\n4\n2\ny\ny\n' | bash apollo.sh 2>&1 | tee ../audit/baseline-build.log
          if grep -q 'ERROR: G965F kernel compilation failed' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log; then
            echo 'The Apollo wrapper suppressed the build failure; failing CI.' >&2
            exit 1
          fi
          find Apollo/Product -type f -name '*G965F*.img' -size +0c | grep .
          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KSU_SUSFS=y$' .config
          grep -q '^CONFIG_EROFS_FS=y$' .config

      - name: Compile updated KernelSU Next candidate - SM-G965F
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          export TERM=xterm DS_ACK_JOBS=2
          ksu_count="$(git -C upstream rev-list --count HEAD)"
          export KSU_VERSION_OVERRIDE="$((30000 + ksu_count + 289))"
          export KSU_VERSION_TAG_OVERRIDE="legacy-$(git -C upstream rev-parse --short=12 HEAD)"
          cd candidate
          printf '2\n4\n2\ny\ny\n' | bash apollo.sh 2>&1 | tee ../audit/candidate-build.log
          if grep -q 'ERROR: G965F kernel compilation failed' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log; then
            echo 'The Apollo wrapper suppressed the build failure; failing CI.' >&2
            exit 1
          fi
          find Apollo/Product -type f -name '*G965F*.img' -size +0c | grep .
          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KSU_SUSFS=y$' .config
          grep -q '^CONFIG_EROFS_FS=y$' .config

      - name: Upload experimental outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-G965F-build-results
          path: |
            audit/*-build.log
            kernel/Apollo/Product/*G965F*.img
            candidate/Apollo/Product/*G965F*.img
          retention-days: 14
          if-no-files-found: warn

      - name: Record status
        if: always()
        run: echo 'Experimental compilation only; no successful boot or SUSFS runtime verification is implied.' >> "$GITHUB_STEP_SUMMARY"
