name: Enforcing KernelSU Next + SUSFS 1.5.5 with init-ksud SELinux transition fix G965F
on:
  push:
    branches: [fix-modules-selinux-exec, g965f-working-bootchain-auto-fixes]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Validate G965F boot-chain setup and recovery hook
        shell: bash
        run: bash scripts/test_bootchain_integration.sh

      - name: Download pinned kernel and KernelSU Next legacy driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git clone --filter=blob:none --depth 1 --single-branch --branch 'duhan-(4.9.337)' \
            https://github.com/Eend15/exynos9810-kernel.git kernel
          git -C kernel fetch --depth 1 origin 8f29b4e0e977d521bb5866ad167b391bea2988c9
          git -C kernel checkout --detach 8f29b4e0e977d521bb5866ad167b391bea2988c9
          git clone --filter=blob:none --depth 1 --single-branch --branch legacy \
            https://github.com/KernelSU-Next/KernelSU-Next.git upstream
          git -C upstream fetch --depth 1 origin 0b17f24246db5c80c056b92c15bcad2b77f1276e
          git -C upstream checkout --detach 0b17f24246db5c80c056b92c15bcad2b77f1276e
          git -C upstream fetch --unshallow --tags || true
          printf 'Device source: %s\nKSU source: %s\n' \
            "$(git -C kernel rev-parse HEAD)" \
            "$(git -C upstream rev-parse HEAD)" | tee audit/commits.txt
          test -f kernel/fs/susfs.c
          test -f kernel/KernelSU-Next/kernel/Kbuild
          test -f kernel/arch/arm64/configs/star2lte_defconfig

      - name: Audit changes and create isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          diff -qr kernel/KernelSU-Next/kernel upstream/kernel > audit/change-summary.txt || test "$?" -eq 1
          diff -ruN kernel/KernelSU-Next/kernel upstream/kernel > audit/driver-update.diff || test "$?" -eq 1
          diff -ruN kernel/KernelSU-Next/uapi upstream/uapi > audit/uapi-update.diff || test "$?" -eq 1
          git -C kernel worktree add --detach ../candidate HEAD
          rsync -a --delete --exclude=.git upstream/kernel/ candidate/KernelSU-Next/kernel/
          rsync -a --delete --exclude=.git upstream/uapi/ candidate/KernelSU-Next/uapi/
          # Initial compatibility probe: retain ROM-specific early init and manager handling.
          for p in core/init.c runtime/ksud_integration.c manager/pkg_observer.c; do
            cp "kernel/KernelSU-Next/kernel/$p" "candidate/KernelSU-Next/kernel/$p"
          done
          python3 scripts/fix_ksu_execveat.py candidate/KernelSU-Next/kernel/core/init.c candidate/KernelSU-Next/kernel/runtime/ksud.h candidate/KernelSU-Next/kernel/runtime/ksud_integration.c
          python3 scripts/fix_ksu_selinux.py candidate/KernelSU-Next/kernel/selinux/rules.c
          python3 scripts/port_ksu_feature_init.py candidate/KernelSU-Next/kernel/core/init.c
          python3 scripts/fix_ksu_symbol_lookup.py candidate/KernelSU-Next/kernel/supercall/dispatch.c
          # Linux 4.9's kernel_read ABI differs from 4.14+. The upstream
          # KernelSU loader used the modern ABI in all three allowlist reads.
          python3 scripts/fix_ksu_allowlist_persistence.py candidate/KernelSU-Next/kernel/policy/allowlist.c
          python3 scripts/fix_ksu_allowlist_persistence.py --verify candidate/KernelSU-Next/kernel/policy/allowlist.c
          grep -Fq 'ksu_kernel_read_compat(fp, &magic, sizeof(magic), &off)' candidate/KernelSU-Next/kernel/policy/allowlist.c
          # KernelSU also reads packages.list using the wrong ABI on Linux 4.9.
          # Correct both reads before UID validation can prune valid profiles.
          python3 scripts/fix_ksu_throne_tracker_reads.py candidate/KernelSU-Next/kernel/manager/throne_tracker.c
          python3 scripts/fix_ksu_throne_tracker_reads.py --verify candidate/KernelSU-Next/kernel/manager/throne_tracker.c
          grep -Fq 'ksu_kernel_read_compat(fp, &chr, sizeof(chr), &pos)' candidate/KernelSU-Next/kernel/manager/throne_tracker.c
          grep -Fq 'ksu_kernel_read_compat(fp, buf, sizeof(buf) - 1, &line_start)' candidate/KernelSU-Next/kernel/manager/throne_tracker.c
          python3 scripts/restore_susfs_bridges.py kernel/KernelSU-Next/kernel candidate/KernelSU-Next/kernel
          # Keep original UN1CA SUSFS v1.5.5 and validated KernelSU Next
          # integration. Repair only the missing userspace boot prerequisite.
          # Keep the already installed /data/adb/ksud (manager UAPI 6).
          # The ROM's /system/bin/ksud is UAPI 4, so never overwrite
          # a modern daemon with the older ROM payload at each reboot.
          # Fix the proven init -> ksu SELinux EACCES only.
          ! grep -q 'copy /system/bin/ksud /data/adb/ksud' candidate/KernelSU-Next/kernel/runtime/ksud_integration.c
          # Match init's nosuid bounded-exec exception to KernelSU Next domain.
          python3 scripts/fix_ksud_selinux_transition.py "$PWD/candidate/security/selinux/hooks.c"
          python3 scripts/fix_ksud_selinux_transition.py "$PWD/candidate/security/selinux/hooks.c" --verify
          grep -q 'u:r:ksu:s0' candidate/security/selinux/hooks.c
          grep -q 'security_bounded_transition' candidate/security/selinux/hooks.c
          git -C candidate add -N -- KernelSU-Next/kernel KernelSU-Next/uapi
          git -C candidate diff -- KernelSU-Next/kernel KernelSU-Next/uapi > audit/candidate.patch
          git -C candidate diff --stat > audit/candidate-stat.txt
          grep -q '^CONFIG_KSU_SUSFS=y$' candidate/arch/arm64/configs/apollo_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' candidate/arch/arm64/configs/apollo_defconfig
          grep -q '^CONFIG_EROFS_FS=y$' candidate/arch/arm64/configs/exynos9810_defconfig

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-source-audit
          path: audit/
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare build runner
        run: |
          set -e
          df -h .
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git rsync curl wget zip unzip bsdiff make build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev cpio lz4 zstd python3 device-tree-compiler xz-utils
          df -h .

      - name: Restore Android Clang 20 cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/google-clang20
          key: google-clang20-r547379-linux-v1

      - name: Download Google Android Clang 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/google-clang20"
          if ! test -x "$RUNNER_TEMP/google-clang20/bin/clang"; then
            curl --http1.1 -fL --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz' \
            --output "$RUNNER_TEMP/clang20.tar.gz"
          tar -tzf "$RUNNER_TEMP/clang20.tar.gz" >/dev/null
            tar -xzf "$RUNNER_TEMP/clang20.tar.gz" -C "$RUNNER_TEMP/google-clang20"
          fi
          test -x "$RUNNER_TEMP/google-clang20/bin/clang"
          echo "DS_ACK_TOOLCHAIN=$RUNNER_TEMP/google-clang20" >> "$GITHUB_ENV"

      - name: Save Android Clang 20 cache before compilation
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/google-clang20
          key: google-clang20-r547379-linux-v1

      - name: Compile original ROM source baseline - SM-G965F
        id: baseline
        shell: bash
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          export TERM=xterm DS_ACK_JOBS=2
          cd kernel
          printf '2\n4\n2\ny\ny\n' | bash apollo.sh 2>&1 | tee ../audit/baseline-build.log
          if grep -q 'ERROR: G965F kernel compilation failed' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log; then
            echo 'The Apollo wrapper suppressed the build failure; failing CI.' >&2
            exit 1
          fi
          find Apollo/Product -type f -name '*G965F*.img' -size +0c | grep .
          # Apollo cleans .config after a successful build; inspect the preserved log instead.
          grep -q 'G965F kernel build finished.' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log
          grep -q 'SELinux.*Enforcing' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log

      - name: Compile updated KernelSU Next candidate - SM-G965F
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          export TERM=xterm DS_ACK_JOBS=2
          ksu_count="$(git -C upstream rev-list --count HEAD)"
          export KSU_VERSION_OVERRIDE="$((30000 + ksu_count + 289))"
          export KSU_VERSION_TAG_OVERRIDE="legacy-$(git -C upstream rev-parse --short=12 HEAD)"
          cd candidate
          printf '2\n4\n2\ny\ny\n' | bash apollo.sh 2>&1 | tee ../audit/candidate-build.log
          if grep -q 'ERROR: G965F kernel compilation failed' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log; then
            echo 'The Apollo wrapper suppressed the build failure; failing CI.' >&2
            exit 1
          fi
          find Apollo/Product -type f -name '*G965F*.img' -size +0c | grep .
          # Apollo cleans .config after a successful build; inspect the preserved log instead.
          grep -q 'G965F kernel build finished.' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log
          grep -q 'SELinux.*Enforcing' ../audit/$(if [ "$PWD" = "$(realpath ../kernel)" ]; then echo baseline; else echo candidate; fi)-build.log

      - name: Upload experimental outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-G965F-build-results
          path: |
            audit/*-build.log
            kernel/Apollo/Product/*G965F*.img
            candidate/Apollo/Product/*G965F*.img
          retention-days: 14
          if-no-files-found: warn

      - name: Download verified UN1CA G965F installer template
        if: steps.candidate.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          run-id: 39648252101
          name: EXPERIMENTAL-G965F-BASELINE-PACKAGING-TEST
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: template

      - name: Download matching UAPI6 manager from official upstream CI
        id: upstream-manager
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: manager
          repository: KernelSU-Next/KernelSU-Next
          run-id: 39297115788
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: bootchain/downloads/upstream-manager

      - name: Verify pinned manager and module archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootchain/downloads/upstream-manager
          if ! find bootchain/downloads/upstream-manager -name '*.apk' -size +0c | grep -q .; then
            curl -fL --retry 4 --retry-all-errors \
              'https://nightly.link/KernelSU-Next/KernelSU-Next/actions/runs/39297115788/manager.zip' \
              -o "$RUNNER_TEMP/upstream-manager.zip"
            unzip -q "$RUNNER_TEMP/upstream-manager.zip" -d bootchain/downloads/upstream-manager
          fi
          src="$(find bootchain/downloads/upstream-manager -type f -name '*.apk' -size +0c -print -quit)"
          test -n "$src" && test -s "$src"
          cp "$src" "bootchain/downloads/KernelSU_Next_v3.4.2-50-gb427a3f9_33405-release.apk"
          unzip -p "bootchain/downloads/KernelSU_Next_v3.4.2-50-gb427a3f9_33405-release.apk" \
            lib/arm64-v8a/libksud.so > bootchain/downloads/ksud-aarch64-linux-android
          python3 scripts/verify_ksunext_apk.py "bootchain/downloads/KernelSU_Next_v3.4.2-50-gb427a3f9_33405-release.apk"
          while read -r name digest url; do
            case "$name" in ""|\#*) continue;; esac
            case "$name" in
              KernelSU_Next_v3.4.2-50-gb427a3f9_33405-release.apk|ksud-aarch64-linux-android) ;;
              NeoZygisk-v2.4-289-release.zip|Vector-v2.2-3080-Release.zip|busybox-aarch64)
                curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 4 \
                  --connect-timeout 30 "$url" -o "bootchain/downloads/$name"
                ;;
              *) echo "Unexpected asset: $name" >&2; exit 1 ;;
            esac
            if [ "$name" = busybox-aarch64 ]; then
              got="$( { printf 'blob %s\0' "$(stat -c%s "bootchain/downloads/$name")"; cat "bootchain/downloads/$name"; } | sha1sum | awk '{print $1}')"
              test "$got" = "$digest"
            else
              echo "$digest  bootchain/downloads/$name" | sha256sum -c -
            fi
          done < bootchain/assets.manifest
          test "$(find bootchain/downloads -maxdepth 1 -type f | wc -l)" -eq 5
          unzip -t bootchain/downloads/NeoZygisk-v2.4-289-release.zip >/dev/null
          unzip -t bootchain/downloads/Vector-v2.2-3080-Release.zip >/dev/null
      - name: Package combined kernel with proven UN1CA DTB
        if: steps.candidate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          candidate_image="$(find candidate/Apollo/Product -type f -name '*G965F*.img' -size +0c -print -quit)"
          test -n "$candidate_image" && test -s "$candidate_image"
          export BUILD_RUN_ID="${{ github.run_id }}"
          bash scripts/package_new_candidate.sh \
            template/EXPERIMENTAL-G965F-package-validation.zip \
            "$candidate_image" "$PWD/UNVERIFIED-G965F-KSU33315-SUSFS155-AUTO-BOOTCHAIN.zip"
          sha256sum UNVERIFIED-G965F-KSU33315-SUSFS155-AUTO-BOOTCHAIN.zip > SHA256SUMS.txt
          unzip -p UNVERIFIED-G965F-KSU33315-SUSFS155-AUTO-BOOTCHAIN.zip BUILD-NOTES.txt > BUILD-NOTES.txt

      - name: Upload experimental G965F combined kernel ZIP
        if: steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-G965F-KSUNext-SUSFS155-AUTO-BOOTCHAIN-TESTZIP
          path: |
            UNVERIFIED-G965F-KSU33315-SUSFS155-AUTO-BOOTCHAIN.zip
            SHA256SUMS.txt
            BUILD-NOTES.txt
          retention-days: 14
          if-no-files-found: error
      - name: Record status
        if: always()
        run: |
          echo 'Experimental build; kernel previously booted, NEW recovery installer hook untested.' >> "$GITHUB_STEP_SUMMARY"
